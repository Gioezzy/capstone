name: capstone
description: "SongketAI — aplikasi mobile generasi motif songket berbasis cDCGAN."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.2

  # State management + dependency injection.
  flutter_riverpod: ^2.4.9

  # Declarative routing (go_router config implemented in Task 8.1).
  go_router: ^10.1.2

  # HTTP client (used by ApiMotifRepository / ApiClient — wired later).
  dio: ^5.3.3

  # Immutable models + JSON serialization annotations (codegen in later tasks).
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Local persistence + file system access.
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Runtime permissions (storage permission for downloads).
  permission_handler: ^11.0.1

  # Date/number formatting.
  intl: ^0.18.1

  # Cached, async image loading with placeholder support.
  cached_network_image: ^3.3.0

  # Runtime Google Fonts (Lora serif heading + Inter sans body) without
  # bundling local font files.
  google_fonts: 6.1.0
  flutter_animate: ^4.5.2
  lottie: ^2.7.0
  palette_generator: ^0.3.3+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended Flutter lints.
  flutter_lints: ^2.0.0

  # Code generation toolchain (freezed / json_serializable).
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1

  # Property-based testing for Dart.
  glados: ^1.1.5

# The following section is specific to Flutter packages.
flutter:
  # Ensures the Material Icons font is included with the application.
  uses-material-design: true

  # Asset folders. Physical folders are kept under version control via
  # .gitkeep so that asset declarations remain valid during pub get/build.
  assets:
    - assets/images/
    - assets/images/placeholders/
